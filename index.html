<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketSmart AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>💰 PocketSmart AI</h1>
    <p>Your Smart Budget & Recommendation Assistant</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Set Your Monthly Budget</h2>
      <div class="row">
        <input id="budget" type="number" placeholder="Enter budget (₹)" min="0">
        <button onclick="setBudget()">Set Budget</button>
      </div>
      <p id="budgetStatus">No budget set yet.</p>
    </section>

    <section class="card">
      <h2>Add an Expense</h2>
      <div class="grid">
        <input id="expenseName" type="text" placeholder="Expense name">
        <input id="expenseAmount" type="number" placeholder="Amount (₹)" min="0">
        <select id="category">
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Education">Education</option>
          <option value="Bills">Bills</option>
          <option value="Other">Other</option>
        </select>
        <button onclick="addExpense()">Add Expense</button>
      </div>
    </section>

    <section class="stats">
      <div class="stat"><span>Budget</span><strong id="totalBudget">₹0</strong></div>
      <div class="stat"><span>Spent</span><strong id="totalSpent">₹0</strong></div>
      <div class="stat"><span>Remaining</span><strong id="remaining">₹0</strong></div>
    </section>

    <section class="card">
      <h2>🤖 Smart Recommendation</h2>
      <div id="recommendation" class="recommendation">
        Add a budget and some expenses to get a recommendation.
      </div>
    </section>

    <section class="card">
      <h2>Expense History</h2>
      <div id="expenseList"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
